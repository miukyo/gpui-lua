name: CI, Build & Docs

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-binaries:
    name: Build gpui-lua (${{ matrix.os_name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            os_name: linux-x86_64
            artifact_name: gpui-lua-linux-x86_64.tar.gz
            bin_path: target/release/gpui-lua
          - os: macos-latest
            os_name: macos-arm64
            artifact_name: gpui-lua-macos-arm64.tar.gz
            bin_path: target/release/gpui-lua
          - os: macos-13
            os_name: macos-x86_64
            artifact_name: gpui-lua-macos-x86_64.tar.gz
            bin_path: target/release/gpui-lua
          - os: windows-latest
            os_name: windows-x86_64
            artifact_name: gpui-lua-windows-x86_64.zip
            bin_path: target/release/gpui-lua.exe

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os_name }}

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev libwayland-dev libx11-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev \
            libxcb-randr0-dev libxcb-xinput-dev \
            libxkbcommon-x11-dev libegl1-mesa-dev \
            libgles2-mesa-dev libglib2.0-dev libfontconfig-dev \
            libasound2-dev libssl-dev pkg-config

      - name: Build gpui-lua binary
        run: cargo build --release -p gpui_lua --bin gpui-lua

      - name: Package binary (Unix)
        if: runner.os != 'Windows'
        run: |
          tar -czf ${{ matrix.artifact_name }} -C target/release gpui-lua

      - name: Package binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path target/release/gpui-lua.exe -DestinationPath ${{ matrix.artifact_name }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}

      - name: Publish to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact_name }}

  deploy-docs:
    name: Deploy Docs to GitHub Pages
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        working-directory: docs
        run: bun install --frozen-lockfile || bun install

      - name: Build VitePress documentation
        working-directory: docs
        env:
          GITHUB_PAGES: 'true'
        run: bun run docs:build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
