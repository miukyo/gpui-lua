name: CI, Build & Docs

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-binaries:
    name: Build gpui-lua (${{ matrix.os_name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            os_name: linux-x86_64
            artifact_name: gpui-lua-linux-x86_64.tar.gz
            bin_path: target/release/gpui-lua
          - os: macos-latest
            os_name: macos-arm64
            artifact_name: gpui-lua-macos-arm64.tar.gz
            bin_path: target/release/gpui-lua
          - os: windows-latest
            os_name: windows-x86_64
            artifact_name: gpui-lua-windows-x86_64.zip
            bin_path: target/release/gpui-lua.exe

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os_name }}

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev libwayland-dev libx11-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev \
            libxcb-randr0-dev libxcb-xinput-dev \
            libxkbcommon-x11-dev libegl1-mesa-dev \
            libgles2-mesa-dev libglib2.0-dev libfontconfig-dev \
            libasound2-dev libssl-dev pkg-config \
            libavcodec-dev libavformat-dev libavutil-dev \
            libswscale-dev libswresample-dev libavdevice-dev libavfilter-dev
          # Link multiarch headers into /usr/include for ffmpeg-sys-next fallback search
          sudo ln -sf /usr/include/x86_64-linux-gnu/libav* /usr/include/ || true
          sudo ln -sf /usr/include/x86_64-linux-gnu/libsw* /usr/include/ || true
          echo "BINDGEN_EXTRA_CLANG_ARGS=-I/usr/include/x86_64-linux-gnu" >> $GITHUB_ENV
          echo "C_INCLUDE_PATH=/usr/include/x86_64-linux-gnu:$C_INCLUDE_PATH" >> $GITHUB_ENV
          echo "FFMPEG_DIR=/usr" >> $GITHUB_ENV

      - name: Install macOS system dependencies
        if: runner.os == 'macOS'
        run: |
          brew install ffmpeg pkg-config
          FFMPEG_PREFIX=$(brew --prefix ffmpeg)
          echo "FFMPEG_DIR=$FFMPEG_PREFIX" >> $GITHUB_ENV
          echo "PKG_CONFIG_PATH=$FFMPEG_PREFIX/lib/pkgconfig:$PKG_CONFIG_PATH" >> $GITHUB_ENV
          echo "BINDGEN_EXTRA_CLANG_ARGS=-I$FFMPEG_PREFIX/include" >> $GITHUB_ENV

      - name: Install Windows FFmpeg and Clang headers
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ffmpegZip = "$env:RUNNER_TEMP\ffmpeg.zip"
          $ffmpegTarget = "$env:RUNNER_TEMP\ffmpeg"
          curl.exe -L "https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-07-31-14-10/ffmpeg-n7.1.5-12-g1fdbca85aa-win64-gpl-shared-7.1.zip" -o $ffmpegZip
          Expand-Archive -Path $ffmpegZip -DestinationPath "$env:RUNNER_TEMP\ffmpeg_raw"
          $extracted = (Get-ChildItem -Directory "$env:RUNNER_TEMP\ffmpeg_raw\ffmpeg-*")[0].FullName
          Move-Item $extracted $ffmpegTarget
          "FFMPEG_DIR=$ffmpegTarget" >> $env:GITHUB_ENV
          "INCLUDE=$ffmpegTarget\include;$env:INCLUDE" >> $env:GITHUB_ENV
          "LIB=$ffmpegTarget\lib;$env:LIB" >> $env:GITHUB_ENV
          "PATH=$ffmpegTarget\bin;$env:PATH" >> $env:GITHUB_ENV

          # Pass UCRT and MSVC headers to bindgen / libclang so errno.h is found
          $ucrt = (Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\Include\*\ucrt" | Select-Object -Last 1).FullName.Replace('\', '/')
          $msvc = (Get-ChildItem "C:\Program Files*\Microsoft Visual Studio\*\*\VC\Tools\MSVC\*\include" | Select-Object -Last 1).FullName.Replace('\', '/')
          # If hwcontext_cuda.h exists in the FFmpeg package, stub out CUDA types to avoid bindgen failures without NVIDIA CUDA SDK
          $cudaHeader = "$ffmpegTarget/include/libavutil/hwcontext_cuda.h"
          if (Test-Path $cudaHeader) {
            $cudaContent = Get-Content $cudaHeader -Raw
            if (-not ($cudaContent -match "typedef void\* CUarray;")) {
              $shim = "typedef void* CUarray;`ntypedef struct { int dummy; } CUDA_ARRAY3D_DESCRIPTOR;`n"
              Set-Content -Path $cudaHeader -Value ($shim + $cudaContent)
            }
          }
          "BINDGEN_EXTRA_CLANG_ARGS=-I`"$ffmpegTarget/include`" -I`"$ucrt`" -I`"$msvc`"" >> $env:GITHUB_ENV

      - name: Build gpui-lua binary
        run: cargo build --release -p gpui_lua --bin gpui-lua
      - name: Package binary (Unix)
        if: runner.os != 'Windows'
        run: |
          tar -czf ${{ matrix.artifact_name }} -C target/release gpui-lua

      - name: Package binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (Test-Path "$env:FFMPEG_DIR\bin") {
            Copy-Item "$env:FFMPEG_DIR\bin\*.dll" target/release/ -Force
          }
          Compress-Archive -Path target/release/gpui-lua.exe, target/release/*.dll -DestinationPath ${{ matrix.artifact_name }}
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}

      - name: Publish to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact_name }}

  deploy-docs:
    name: Deploy Docs to GitHub Pages
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        working-directory: docs
        run: bun install --frozen-lockfile || bun install

      - name: Build VitePress documentation
        working-directory: docs
        env:
          GITHUB_PAGES: 'true'
        run: bun run docs:build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
